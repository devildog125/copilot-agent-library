name: Validate Agents

# Triggers: pushes and PRs to main, plus manual runs.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Fetch the repo so the scripts and agents are available.
      - uses: actions/checkout@v4

      # The validator checks frontmatter, tools, model, and structure of every agent.
      - name: Validate agent files
        run: bash scripts/validate-agents.sh

      # Guard against agents being deleted by accident: the library ships 37.
      - name: Count agents
        run: |
          AGENT_COUNT=$(find agents -name "*.agent.md" | wc -l)
          echo "Found $AGENT_COUNT agents"
          if [ "$AGENT_COUNT" -lt 37 ]; then
            echo "Expected at least 37 agents, found $AGENT_COUNT"
            exit 1
          fi
          echo "::notice::Successfully validated $AGENT_COUNT agents"

      # Core repo files must exist.
      - name: Check documentation
        run: |
          REQUIRED_DOCS="README.md CONTRIBUTING.md LICENSE TESTING.md CODE_OF_CONDUCT.md"
          for doc in $REQUIRED_DOCS; do
            if [ ! -f "$doc" ]; then
              echo "Missing required file: $doc"
              exit 1
            fi
          done
          echo "All required documentation present"
